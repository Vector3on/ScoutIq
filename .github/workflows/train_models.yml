# .github/workflows/train_models.yml
#
# OPAL Framework - LEARN Layer Workflow
#
# This workflow is run weekly or manually to train our predictive models.
# It saves the trained model as an artifact that the daily pipeline uses.

name: OPAL - Weekly Model Training

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 1 * * 0' # Run every Sunday at 1 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-tft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }

      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      # This job needs the same graph data as the daily run
      - name: Create Mock Data
        run: |
          mkdir -p data
          echo "project_id,description,stars" > data/projects.csv
          echo "\"ollama/ollama\",\"Get up and running with large language models, locally.\",50000" >> data/projects.csv
          echo "\"langchain-ai/langchain\",\"Building applications with LLMs through composability\",80000" >> data/projects.csv
      
      - name: Build Graph (for data prep)
        run: python observe/build_graph.py
        
      - name: Prepare Time-Series Data
        run: python predict/prepare_tft_data.py
      
      - name: Train Temporal Fusion Transformer
        run: python predict/train_tft_model.py
        
      # Upload the final trained model as an artifact for the daily pipeline
      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tft-model-checkpoint
          path: artifacts/tft_model.ckpt
          retention-days: 14 # Keep the model for 2 weeks
