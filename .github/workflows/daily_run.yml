name: Bloodhound Definitive Pipeline (Local AI)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-definitive-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: PHASE 1 - Run GitHub Data Collector
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: python collectors/github_scraper.py
    
    - name: PHASE 1.5 - Run Reddit Data Collector
      env:
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      run: python collectors/reddit_scraper.py # This now saves to reddit_leads.json
    
    - name: PHASE 2 - Run Local AI Entity Resolver
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        # We tell the resolver where to find the file created in the previous step
        REDDIT_LEADS_PATH: reddit_leads.json
      run: python processors/entity_resolver.py
