# .github/workflows/daily_run.yml
# This version uses a robust, programmatic method to find and set the PATH for the Gemini CLI.

name: Project Bloodhound - Full Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # --- UPDATED: Definitive Installation and PATH Configuration ---
    - name: Install Dependencies & Configure Gemini CLI Path
      run: |
        python -m pip install --upgrade pip
        # Install all python packages, including google-generativeai
        pip install -r requirements.txt
        
        # This is the robust way to find where pip installs executables.
        # We query Python's site module for the user-specific base directory...
        USER_BASE_PATH=$(python -m site --user-base)
        
        # ...and then add the '/bin' subdirectory to the GITHUB_PATH.
        # This ensures that any command installed by pip is found by later steps.
        echo "Adding $USER_BASE_PATH/bin to GITHUB_PATH"
        echo "$USER_BASE_PATH/bin" >> $GITHUB_PATH

    - name: Verify Gemini CLI Installation
      run: |
        # This step will now succeed because the correct path has been added.
        gemini --version

    - name: PHASE 0 - Clear Database
      env:
        CI: true
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: python tools/clear_database.py

    - name: PHASE 1 - Run Collectors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      run: |
        echo "--- Running Data Collectors ---"
        python collectors/github_scraper.py
        python collectors/reddit_scraper.py

    - name: PHASE 2 - Run Data Processors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "--- Running Data Processors ---"
        python processors/entity_resolver.py
        python processors/unified_scorer.py
        python processors/gemini_cli_enricher.py
      
    - name: PHASE 3 - Run Semantic Search Tool (Test)
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Semantic Search Test ---"
        python tools/semantic_search.py "local llm"
