name: Bloodhound Scrape and Verify

on:
  workflow_dispatch:

jobs:
  scrape-and-verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run GitHub Scraper
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: python collectors/github_scraper.py

    - name: Run Reddit Scraper
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      run: python collectors/reddit_scraper.py

    - name: Verify Graph State - Count Projects
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        python -c "
        import os
        from neo4j import GraphDatabase
        uri = os.environ.get('NEO4J_URI')
        user = os.environ.get('NEO4J_USERNAME')
        password = os.environ.get('NEO4J_PASSWORD')
        driver = GraphDatabase.driver(uri, auth=(user, password))
        with driver.session() as session:
            result = session.run('MATCH (p:Project) RETURN count(p) AS count')
            count = result.single()['count']
            print(f'VERIFICATION: Found {count} Project nodes.')
        driver.close()
        "

    - name: Verify Graph State - Count Signals
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        python -c "
        import os
        from neo4j import GraphDatabase
        uri = os.environ.get('NEO4J_URI')
        user = os.environ.get('NEO4J_USERNAME')
        password = os.environ.get('NEO4J_PASSWORD')
        driver = GraphDatabase.driver(uri, auth=(user, password))
        with driver.session() as session:
            result = session.run('MATCH (s:Signal) RETURN count(s) AS count')
            count = result.single()['count']
            print(f'VERIFICATION: Found {count} Signal nodes.')
            if count == 0:
                print('CRITICAL FAILURE: Reddit scraper did not create any Signal nodes.')
        driver.close()
        "
