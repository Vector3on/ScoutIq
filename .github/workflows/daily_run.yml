name: Bloodhound Professional Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Run automatically at 5 AM UTC daily

jobs:
  run-full-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        # Add our new QC tools
        pip install black ruff mypy
        pip install -r requirements.txt

    # --- QUALITY CONTROL GATES ---
    - name: Auto-Format Code with Black
      run: black --check .

    - name: Lint with Ruff
      run: ruff check .

    - name: Check Types with MyPy
      run: mypy . --ignore-missing-imports

    # --- EXECUTION PHASES ---
    - name: PHASE 1 - Run Data Collectors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      run: |
        python collectors/github_scraper.py
        python collectors/reddit_scraper.py

    - name: PHASE 1.5 - Run Live AI Entity Resolver
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: python processors/entity_resolver.py
