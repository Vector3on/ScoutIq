# .github/workflows/daily_run.yml
#
# This workflow runs the entire Project Bloodhound pipeline in the correct order.
# 1. Collectors gather raw data.
# 2. Processors enrich the data (creating embeddings and scores).
# 3. Tools can then query the enriched data.

name: Project Bloodhound - Full Pipeline

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  schedule:
    - cron: '0 12 * * *' # Runs at 12:00 PM UTC every day

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- STEP 1: RUN COLLECTORS ---
    - name: PHASE 1 - Run Collectors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Data Collectors ---"
        python collectors/github_scraper.py
        python collectors/reddit_scraper.py

    # --- STEP 2: RUN PROCESSORS (This is the critical fix) ---
    - name: PHASE 2 - Run Data Processors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Data Processors ---"
        # This script creates the embeddings required for semantic search
        python processors/entity_resolver.py
        # This script calculates the bloodhound_score
        python processors/unified_scorer.py
      
    # --- STEP 3: RUN SEMANTIC SEARCH TOOL ---
    - name: PHASE 3 - Run Semantic Search Tool (Test)
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Semantic Search Test ---"
        # This will now succeed because the processor has created the embeddings
        python tools/semantic_search.py "ollama"

