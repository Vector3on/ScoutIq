# .github/workflows/daily_run.yml
# This version integrates the Gemini CLI.

name: Project Bloodhound - Full Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # --- NEW STEP: Install Gemini CLI ---
    - name: Install Gemini CLI
      run: |
        echo "Installing Gemini CLI..."
        # This command downloads and runs the official installer script.
        curl -s -L https://ai.google.dev/gemini-cli/install.sh | bash
        # Add the install location to the GitHub Actions path so it can be found.
        echo "$HOME/.google/bin" >> $GITHUB_PATH
        # Verify the installation.
        gemini --version

    - name: PHASE 0 - Clear Database
      env:
        CI: true
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: python tools/clear_database.py

    - name: PHASE 1 - Run Collectors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      run: |
        echo "--- Running Data Collectors ---"
        python collectors/github_scraper.py
        python collectors/reddit_scraper.py

    # --- UPDATED PROCESSOR STEP ---
    - name: PHASE 2 - Run Data Processors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        echo "--- Running Data Processors ---"
        python processors/entity_resolver.py
        python processors/unified_scorer.py
        # Run the new CLI-based enrichment processor
        python processors/gemini_cli_enricher.py
      
    - name: PHASE 3 - Run Semantic Search Tool (Test)
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Semantic Search Test ---"
        python tools/semantic_search.py "local llm"
