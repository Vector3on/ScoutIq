name: Bloodhound Daily Run

# This action will trigger on a schedule.
# This cron expression means "run at 01:00 UTC every day".
on:
  schedule:
    - cron: '0 1 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checks-out your repository so the job can access your code
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Sets up a Python environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Installs all our required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install fuzzywuzzy python-levenshtein

    # Step 4: The main event - runs your full pipeline script
    - name: Run Bloodhound Pipeline
      env:
        # This is where we securely pass your secrets to the script
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      run: python run_bloodhound.py
