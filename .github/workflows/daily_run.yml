# .github/workflows/daily_run.yml
# This is the master workflow, updated to run the new Hacker News collector
# and the advanced Signal Fusion scorer.

name: Project Bloodhound - Full Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Ensure 'requests' is in your requirements.txt for the Hacker News collector
        pip install -r requirements.txt

    - name: PHASE 0 - Clear Database
      env:
        CI: true
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: python tools/clear_database.py

    # --- UPDATED COLLECTOR STEP ---
    - name: PHASE 1 - Run Collectors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      run: |
        echo "--- Running Data Collectors ---"
        python collectors/github_scraper.py
        python collectors/reddit_scraper.py
        # Run the new Hacker News collector
        python collectors/hacker_news_collector.py

    - name: PHASE 2 - Run Data Processors
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Data Processors ---"
        python processors/entity_resolver.py
        # This now runs the new Signal Fusion Engine
        python processors/unified_scorer.py
      
    - name: PHASE 3 - Run Semantic Search Tool (Test)
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        echo "--- Running Semantic Search Test ---"
        python tools/semantic_search.py "local llm"
