name: Bloodhound Semantic Search Test

on:
  workflow_dispatch:

jobs:
  run-semantic-search:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # We need to ensure sentence-transformers is in our requirements
        pip install -r requirements.txt

    - name: PHASE 1 - Populate Database
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: python collectors/github_scraper.py
      
    - name: PHASE 2 - Run Semantic Search Tool
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      # We run the script with "ollama" as the test case.
      # Success depends on "ollama" being present in the data from PHASE 1.
      run: python tools/semantic_search.py "ollama"
