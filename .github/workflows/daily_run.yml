name: Bloodhound Founder Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-founder-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: python -m pip install -r requirements.txt

    - name: Set up Graph Constraints for Founders
      env:
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      run: |
        python -c "
        import os
        from neo4j import GraphDatabase
        uri = os.environ.get('NEO4J_URI')
        user = os.environ.get('NEO4J_USERNAME')
        password = os.environ.get('NEO4J_PASSWORD')
        driver = GraphDatabase.driver(uri, auth=(user, password))
        with driver.session() as session:
            print('Creating constraint for Founder nodes...')
            session.run('CREATE CONSTRAINT founder_name_unique IF NOT EXISTS FOR (f:Founder) REQUIRE f.name IS UNIQUE')
            print('Constraint created successfully.')
        driver.close()
        "
