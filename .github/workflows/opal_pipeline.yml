predict:
  runs-on: ubuntu-latest
  needs: observe
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Download Graph Artifact
      uses: actions/download-artifact@v4
      with:
        name: graph-artifact
        path: artifacts

    # ✅ Download Trained TFT Model from train_models.yml using PAT
    - name: Download Trained TFT Model
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: train_models.yml
        workflow_conclusion: success
        name: tft-model-checkpoint
        path: artifacts
        repo: Vector3on/ScoutIq
        github_token: ${{ secrets.ACTIONS_PAT }}

    - name: Verify All Artifacts
      run: ls -R artifacts

    - name: Build FAISS Index
      run: python predict/build_index.py

    - name: Prepare TabPFN Features
      run: python predict/prepare_tabpfn_data.py

    - name: Run TabPFN Scorer
      run: python predict/run_tabpfn_scorer.py

    - name: Prepare Time-Series Data for Prediction
      run: python predict/prepare_tft_data.py

    - name: Run TFT Predictor
      run: python predict/run_tft_predictor.py

    - name: Upload Results
      uses: actions/upload-artifact@v4
      with:
        name: results
        path: results/
