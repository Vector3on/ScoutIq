# .github/workflows/opal_pipeline.yml
# OPAL Unified Pipeline — auto-predicts with TFT and TabPFN daily

name: OPAL - Full Unified Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 4 AM UTC

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Create Mock Data
        run: |
          mkdir -p data
          echo "project_id,description,stars" > data/projects.csv
          echo "\"ollama/ollama\",\"Get up and running with large language models, locally.\",50000" >> data/projects.csv
          echo "\"langchain-ai/langchain\",\"Building applications with LLMs through composability\",80000" >> data/projects.csv
      - name: Build Graph and Embeddings
        run: python observe/build_graph.py
      - name: Upload Graph Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-artifact
          path: artifacts/

  predict:
    runs-on: ubuntu-latest
    needs: observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download Graph Artifact
        uses: actions/download-artifact@v4
        with:
          name: graph-artifact
          path: artifacts

      # 🔥 FIXED: No cross-workflow artifact issues
      - name: Run Training if No Model Exists
        run: |
          if [ ! -f artifacts/tft-model-checkpoint.ckpt ]; then
            echo "📉 No existing model. Training..."
            python predict/train_tft_model.py
          else
            echo "✅ Model exists. Skipping training."
          fi

      - name: Verify Artifacts
        run: ls -R artifacts

      - name: Build FAISS Index
        run: python predict/build_index.py

      - name: Run TabPFN Scorer
        run: python predict/run_tabpfn_scorer.py

      - name: Prepare Time-Series Data for Prediction
        run: python predict/prepare_tft_data.py

      - name: Run TFT Predictor
        run: python predict/run_tft_predictor.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/

  act:
    runs-on: ubuntu-latest
    needs: predict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download Results
        uses: actions/download-artifact@v4
        with:
          name: results
          path: .
      - name: Format Slack Message
        run: python act/format_slack_message.py
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
      - name: Send Detailed Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload-file-path: "./slack_payload.json"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
