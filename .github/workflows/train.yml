# .github/workflows/train.yml
# This workflow deploys the Modal application, which will then run on its schedule.

name: Deploy Bloodhound VC Weekly Training Job

on:
  # Run this workflow automatically whenever you push to the 'main' branch
  push:
    branches:
      - main
  # Also allow running it manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy-modal-app:
    name: Deploy to Modal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Modal
        run: pip install modal

      - name: Deploy to Modal
        # This command connects to Modal using your secrets and deploys the app.
        # The app will then run on the schedule defined in the Python script.
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_train_tft.py

