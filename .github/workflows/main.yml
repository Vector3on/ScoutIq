# .github/workflows/main.yml (Final Artifact-Based Version)
name: Bloodhound OPAL Daily Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  daily-run:
    name: Daily Signal Prediction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- THIS IS THE DEFINITIVE FIX ---
      # Step 1: Download the model artifact from the latest successful weekly run
      - name: Download Model from Weekly Run Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading TFT model from the latest successful artifact..."
          gh run list --workflow="main.yml" --repo=$GITHUB_REPOSITORY --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1 | xargs -I % gh run download % --repo=$GITHUB_REPOSITORY --name tft-model-checkpoint --dir artifacts
          
          echo "Verifying downloaded artifacts..."
          ls -lh artifacts/

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the Daily Pipeline
        run: python daily_run.py
        env:
          # Your secrets go here
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
