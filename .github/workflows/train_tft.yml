# .github/workflows/train_tft.yml
#
# FINAL FIXED VERSION — works regardless of nesting inside ScoutIq

name: OPAL - Weekly TFT Training

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3 AM UTC
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r ScoutIq/requirements.txt  # ✅ corrected path to requirements.txt

      - name: Run TFT Trainer
        run: python ScoutIq/predict/train_tft_model.py  # ✅ no working-dir nonsense

      - name: Upload Model Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: tft-model-checkpoint
          path: ScoutIq/checkpoints/tft_model.ckpt  # ✅ full path
