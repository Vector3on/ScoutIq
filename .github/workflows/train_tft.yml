# .github/workflows/train_tft.yml
#
# Corrected OPAL TFT Trainer — Weekly retrain with correct working directory

name: OPAL - Weekly TFT Training

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3:00 AM UTC
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ScoutIq  # ✅ fix the path to match repo structure

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run TFT Trainer
        run: python predict/train_tft_model.py  # ✅ no double ScoutIq

      - name: Upload Model Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: tft-model-checkpoint
          path: checkpoints/tft_model.ckpt
