name: 'ScoutIQ Daily Discovery Run'

on:
  schedule:
    # Runs every day at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual running from the Actions tab

jobs:
  run-scoutiq-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v4

    - name: 'Set up Python 3.10'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 'Install Dependencies'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 'Run ScoutIQ Pipeline'
      # The SLACK_WEBHOOK_URL is passed in as an environment variable
      # from the repository's secrets.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Also pass the GitHub token for API calls
      run: python main.py

    - name: 'Upload Markdown Reports as Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: intelligence-briefings
        path: 'reporting/*.md'

