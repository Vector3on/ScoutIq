name: Weekly TFT Model Updater

on:
  push:
    paths:
      - artifacts/tft_model.ckpt
  workflow_dispatch:

jobs:
  sync-weekly-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Slack (optional)
        run: |
          echo "✅ New model pushed from Colab at $(date)"

      # You can plug in scoring, Slack formatting, inference here
