name: Refresh ScoutIQ

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Enrichment depth
        required: false
        default: full
        type: choice
        options: [full, incremental, weekly]
  push:
    branches: [master]
    paths-ignore:
      - "data/**"
      - "public/data/**"
  schedule:
    - cron: "17 * * * *"
    - cron: "41 2 * * 0"

permissions:
  contents: write

concurrency:
  group: scoutiq-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select enrichment mode
        shell: bash
        run: |
          if [ "${{ github.event.schedule }}" = "41 2 * * 0" ] || [ "${{ inputs.mode }}" = "weekly" ]; then
            echo "ENRICH_MODE=weekly" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "17 * * * *" ] || [ "${{ inputs.mode }}" = "incremental" ]; then
            echo "ENRICH_MODE=incremental" >> "$GITHUB_ENV"
          else
            echo "ENRICH_MODE=full" >> "$GITHUB_ENV"
          fi

      - name: Collect, enrich, and rank payable candidates
        id: collect
        env:
          SCOUTIQ_GITHUB_TOKEN: ${{ secrets.SCOUTIQ_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SCOUTIQ_GITHUB_TOKEN || github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: node scripts/collect.mjs

      - name: Commit changed radar data and caches
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "scoutiq-bot"
          git config user.email "scoutiq-bot@users.noreply.github.com"
          git add data public/data
          git commit -m "data: refresh ScoutIQ v2"
          git push

      - name: Send optional Discord alert
        if: steps.collect.outputs.event_count != '0'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify.mjs

  verify-source-change:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: env -u GITHUB_ACTIONS npm test
