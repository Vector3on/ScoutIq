# .github/workflows/observe.yml
#
# OPAL Framework - OBSERVE Layer Workflow
#
# FINAL VERSION: This workflow now uploads the graph as a build artifact
# to avoid all cache-related race conditions.

name: OPAL - Observe Layer

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 4 * * *' # Run daily at 4 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create Mock Data
        run: |
          mkdir -p data
          echo "project_id,description" > data/projects.csv
          echo "\"ollama/ollama\",\"Get up and running with large language models, locally.\"" >> data/projects.csv
          echo "\"langchain-ai/langchain\",\"Building applications with LLMs through composability\"" >> data/projects.csv
          echo "signal_id,project_id,source,content" > data/signals.csv
          echo "\"hn_123\",\"ollama/ollama\",\"Hacker News\",\"Ollama is now available on Windows.\"" >> data/signals.csv
          echo "\"rd_456\",\"langchain-ai/langchain\",\"Reddit\",\"Has anyone tried LangChain for complex agentic workflows?\"" >> data/signals.csv

      - name: Build Graph and Embeddings
        run: python observe/build_graph.py

      # --- THE FIX: Use Artifacts instead of Cache ---
      # This step uploads the generated graph file as an artifact named 'graph-artifact'.
      # The subsequent workflow will download this specific artifact.
      - name: Upload Graph Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-artifact
          path: artifacts/hetero_graph_with_embeddings.gpickle

