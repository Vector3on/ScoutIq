# .github/workflows/predict.yml
#
# FINAL CORRECTED VERSION
#
# This workflow now uses a Personal Access Token (PAT) to grant it the
# necessary permissions to download artifacts from the triggering workflow.

name: OPAL - Predict Layer

on:
  workflow_run:
    workflows: ["OPAL - Observe Layer"]
    types:
      - completed

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- THE DEFINITIVE FIX ---
      # We now use our powerful ACTIONS_PAT secret. This provides the
      # 'dawidd6/action-download-artifact' action with the permissions it needs.
      - name: Download Graph Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.ACTIONS_PAT }}
          workflow: ${{ github.event.workflow_run.workflow_id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: graph-artifact
          path: artifacts

      - name: Verify Artifact was Downloaded
        run: ls -R artifacts

      - name: Build FAISS Index
        run: python predict/build_index.py

      - name: Run GraphRAG Inference
        run: |
          mkdir -p results
          python predict/run_graph_rag.py "local large language models" > results/graphrag_results.json
      
      - name: Upload Hype Score Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hype-scores
          path: results/graphrag_results.json
