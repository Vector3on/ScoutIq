# .github/workflows/predict.yml
#
# OPAL Framework - PREDICT Layer Workflow
#
# FINAL VERSION: This workflow now downloads the build artifact from the
# triggering 'Observe' run, completely avoiding cache conflicts.

name: OPAL - Predict Layer

on:
  workflow_run:
    workflows: ["OPAL - Observe Layer"]
    types:
      - completed

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- THE FIX: Use Artifacts instead of Cache ---
      # This step finds the specific run that triggered this workflow and
      # downloads the 'graph-artifact' that it uploaded.
      - name: Download Graph Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          name: graph-artifact
          path: artifacts

      - name: Verify Artifact was Downloaded
        run: |
          if [ ! -f "artifacts/hetero_graph_with_embeddings.gpickle" ]; then
            echo "Error: Failed to download the graph artifact from the Observe workflow."
            exit 1
          fi
          echo "Graph artifact successfully downloaded."

      - name: Build FAISS Index
        run: python predict/build_index.py

      - name: Run GraphRAG Inference
        run: |
          mkdir -p results
          python predict/run_graph_rag.py "local large language models" > results/graphrag_results.json
      
      - name: Upload Hype Score Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hype-scores
          path: results/graphrag_results.json

