# .github/workflows/self_improvement.yml
name: 'Omega Agent Self-Improvement Cycle'

on:
  workflow_dispatch:
    inputs:
      base_model_version:
        description: 'The model version to use for generating self-play data (e.g., v5)'
        required: true
        default: 'v5'
      new_model_version:
        description: 'The new model version to be trained (e.g., v6)'
        required: true
        default: 'v6'
      num_self_play_episodes:
        description: 'Number of self-play episodes to generate'
        required: true
        default: '500'

jobs:
  run-self-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Set a 6-hour timeout for the job

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Set up Python 3.11 and Node.js 20'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Install Dependencies'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd scanners && npm install && cd ..
          node scanners/node_modules/puppeteer/install.js

      - name: 'Set up Model Cache'
        uses: actions/cache@v4
        id: model-cache
        with:
          path: |
            *.pth
            *.pt
          key: ${{ runner.os }}-models-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: 'Run Self-Improvement Cycle'
        # THE FIX: Pass the inputs as environment variables directly to the step.
        # This is a more robust way to handle variables in GitHub Actions.
        env:
          BASE_VERSION: ${{ github.event.inputs.base_model_version }}
          NEW_VERSION: ${{ github.event.inputs.new_model_version }}
          NUM_EPISODES: ${{ github.event.inputs.num_self_play_episodes }}
        run: |
          echo "--- Starting Self-Improvement Cycle: Training ${NEW_VERSION} from ${BASE_VERSION} ---"

          # STEP 1: Generate self-play data using the base models
          echo "--- Generating ${NUM_EPISODES} self-play trajectories using ${BASE_VERSION} models... ---"
          python -m simulation.generate_self_play \
            --world_model_path world_model_${BASE_VERSION}.pth \
            --value_function_path value_function_${BASE_VERSION}.pth \
            --num_episodes ${NUM_EPISODES}

          # STEP 2: Pre-process the combined datasets
          echo "--- Pre-processing combined data for ${NEW_VERSION} models... ---"
          python -m control.preprocess_data \
            --data_dirs simulation/trajectories/ simulation/self_play_trajectories/ \
            --output_file radt_preprocessed_data_${NEW_VERSION}.pt

          # STEP 3: Train the new models
          echo "--- Training ${NEW_VERSION} World Model... ---"
          python -m control.train_world_model \
            --data_file radt_preprocessed_data_${NEW_VERSION}.pt \
            --output_path world_model_${NEW_VERSION}.pth

          echo "--- Training ${NEW_VERSION} Value Function... ---"
          python -m control.train_value_function \
            --data_file radt_preprocessed_data_${NEW_VERSION}.pt \
            --output_path value_function_${NEW_VERSION}.pth

      - name: 'Upload New Models and Data as Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: omega-models-${{ github.event.inputs.new_model_version }}
          path: |
            world_model_${{ github.event.inputs.new_model_version }}.pth
            value_function_${{ github.event.inputs.new_model_version }}.pth
            radt_preprocessed_data_${{ github.event.inputs.new_model_version }}.pt
