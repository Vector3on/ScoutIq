# This file tells Gitpod how to configure the workspace.
image:
  file: .gitpod.Dockerfile

# Tasks to run when the workspace starts.
tasks:
  - name: Setup & Info
    init: |
      echo "Your Bloodhound VC environment is ready."
      echo "To run the weekly training, use the built-in terminal and run:"
      echo "source ~/miniconda/bin/activate bloodhound_env && python weekly_training_run.py"
    command: |
      # This command runs when you open a terminal.
      # It automatically activates our clean conda environment.
      source ~/miniconda/bin/activate bloodhound_env
      clear
      echo "✅ Bloodhound VC environment activated."
      echo "Run 'python weekly_training_run.py' to start training."

